name: Deploy site to GitHub Pages

on:
  push:
    branches: [main]
  pull_request:
  # Refresh the shared showtimes snapshot every 6 hours (00:17, 06:17, 12:17, 18:17 UTC,
  # i.e. 08:17, 14:17, 20:17, 02:17 in Malaysia). Off the hour, since :00 runs are often delayed.
  schedule:
    - cron: "17 */6 * * *"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Python tests
        run: python3 -m unittest discover -s tests -t .
      - name: JavaScript tests
        run: node --test "tests/js/*.test.mjs"

  deploy:
    needs: test
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Copy the site
        run: cp -r site _site
      - name: Showtimes snapshot (fetch on schedule; reuse the published one on a code push)
        run: |
          if [ "${{ github.event_name }}" = "push" ]; then
            node scripts/snapshot.mjs --out _site/data/showtimes.json \
              --reuse https://edwardywy.github.io/52frames/data/showtimes.json
          else
            node scripts/snapshot.mjs --out _site/data/showtimes.json
          fi
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4

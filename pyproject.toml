[project]
name = "cinema-showtimes"
version = "0.1.0"
description = "Check GSC and TGV cinema showtimes across Malaysia in one place."
readme = "README.md"
requires-python = ">=3.10"
dependencies = []

[project.scripts]
cinema-showtimes = "cinema_showtimes.cli:main"

[tool.setuptools.packages.find]
include = ["cinema_showtimes*"]

[tool.setuptools.package-data]
cinema_showtimes = ["static/*.html"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B"]

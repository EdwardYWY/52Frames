<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>GSC + TGV Showtimes</title>
<style>
  :root {
    --bg: #f6f6f4; --card: #ffffff; --text: #1d1d1f; --muted: #6b6b70; --line: #e3e3e0;
    --gsc: #c8102e; --tgv: #1f4fd1; --chip: #f0f0ee; --chip-hover: #e2e2df; --accent: #1d1d1f;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #141416; --card: #1d1d20; --text: #ececee; --muted: #9a9aa2; --line: #2e2e33;
      --gsc: #ff5a6e; --tgv: #6f95ff; --chip: #2a2a2f; --chip-hover: #36363c; --accent: #ececee;
    }
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text);
         font: 15px/1.45 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
  header { padding: 20px 16px 8px; max-width: 1100px; margin: 0 auto; }
  h1 { margin: 0 0 4px; font-size: 22px; }
  .sub { color: var(--muted); margin: 0; }
  form { max-width: 1100px; margin: 0 auto; padding: 12px 16px; display: flex; flex-wrap: wrap; gap: 10px; align-items: end; }
  label { display: flex; flex-direction: column; font-size: 12px; color: var(--muted); gap: 4px; }
  input, select, button { font: inherit; color: var(--text); background: var(--card);
         border: 1px solid var(--line); border-radius: 8px; padding: 7px 10px; }
  input[type=search] { min-width: 180px; }
  .chains { flex-direction: row; gap: 12px; align-items: center; padding-bottom: 8px; color: var(--text); font-size: 14px; }
  .chains label { flex-direction: row; align-items: center; color: var(--text); font-size: 14px; }
  button { background: var(--accent); color: var(--bg); border-color: var(--accent); cursor: pointer; font-weight: 600; }
  main { max-width: 1100px; margin: 0 auto; padding: 0 16px 40px; }
  #status { color: var(--muted); margin: 6px 0 14px; min-height: 1.4em; }
  #status .err { color: var(--gsc); }
  .movie { background: var(--card); border: 1px solid var(--line); border-radius: 12px; padding: 14px 16px; margin-bottom: 12px; }
  .movie h2 { margin: 0 0 2px; font-size: 17px; }
  .meta { color: var(--muted); font-size: 13px; margin-bottom: 8px; }
  .row { display: grid; grid-template-columns: minmax(180px, 280px) 1fr; gap: 8px; padding: 6px 0; border-top: 1px solid var(--line); }
  .cinema { font-size: 14px; }
  .badge { display: inline-block; font-size: 11px; font-weight: 700; color: #fff; border-radius: 4px; padding: 1px 5px; margin-right: 6px; }
  .badge.GSC { background: var(--gsc); } .badge.TGV { background: var(--tgv); }
  .times { display: flex; flex-wrap: wrap; gap: 6px; }
  .time { background: var(--chip); border-radius: 6px; padding: 2px 8px; font-size: 13px; text-decoration: none; color: var(--text); white-space: nowrap; }
  a.time:hover { background: var(--chip-hover); }
  .time small { color: var(--muted); margin-left: 4px; }
  .time.full { text-decoration: line-through; opacity: .55; }
  @media (max-width: 640px) {
    .row { grid-template-columns: 1fr; }
    input[type=search] { min-width: 0; width: 100%; }
    form > label { flex: 1 1 140px; }
  }
</style>
</head>
<body>
<header>
  <h1>GSC + TGV Showtimes</h1>
  <p class="sub">Golden Screen Cinemas and TGV Cinemas across Malaysia, in one place.</p>
</header>

<form id="controls">
  <label>Date <select id="date"></select></label>
  <label>Region
    <select id="region">
      <option>Klang Valley</option><option>Northern</option><option>Southern</option>
      <option>East Coast</option><option>East Malaysia</option><option value="">All Malaysia</option>
    </select>
  </label>
  <div class="chains">
    <label><input type="checkbox" name="chain" value="GSC" checked> GSC</label>
    <label><input type="checkbox" name="chain" value="TGV" checked> TGV</label>
  </div>
  <button type="submit">Load showtimes</button>
  <label>Movie <input type="search" id="movie" placeholder="e.g. jailer"></label>
  <label>Cinema <input type="search" id="cinema" placeholder="e.g. pavilion"></label>
  <label>From <input type="time" id="after"></label>
</form>

<main>
  <div id="status"></div>
  <div id="results"></div>
</main>

<script>
const $ = (id) => document.getElementById(id);
let shows = [];
let loadErrors = [];

function pad(n) { return String(n).padStart(2, "0"); }
function isoDate(d) { return `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`; }

(function fillDates() {
  const today = new Date();
  for (let i = 0; i < 7; i++) {
    const d = new Date(today.getFullYear(), today.getMonth(), today.getDate() + i);
    const label = i === 0 ? "Today" : i === 1 ? "Tomorrow" :
      d.toLocaleDateString(undefined, { weekday: "short", day: "numeric", month: "short" });
    $("date").add(new Option(label, isoDate(d)));
  }
})();

function el(tag, attrs = {}, ...children) {
  const node = document.createElement(tag);
  for (const [k, v] of Object.entries(attrs)) {
    if (k === "class") node.className = v; else node.setAttribute(k, v);
  }
  for (const c of children) node.append(c);
  return node;
}

function chains() {
  return [...document.querySelectorAll("input[name=chain]:checked")].map((c) => c.value);
}

async function load() {
  const params = new URLSearchParams({ date: $("date").value, region: $("region").value });
  chains().forEach((c) => params.append("chain", c));
  $("status").textContent = "Loading showtimes from GSC and TGV… (first load for a region can take ~10–20s)";
  $("results").replaceChildren();
  try {
    const res = await fetch(`/api/showtimes?${params}`);
    const body = await res.json();
    if (!res.ok) throw new Error(body.error || res.statusText);
    shows = body.showtimes;
    loadErrors = body.errors;
    render();
  } catch (err) {
    $("status").replaceChildren(el("span", { class: "err" }, `Failed to load: ${err.message}`));
  }
}

function render() {
  const movieQ = $("movie").value.trim().toLowerCase();
  const cinemaQ = $("cinema").value.trim().toLowerCase();
  const after = $("after").value;
  const visible = shows.filter((s) => {
    if (movieQ && !s.movie_title.toLowerCase().includes(movieQ) && !s.movie_key.includes(movieQ)) return false;
    if (cinemaQ && !s.cinema_name.toLowerCase().includes(cinemaQ)) return false;
    // Shows after midnight belong to the previous day's schedule, so keep them.
    const startDate = s.start.slice(0, 10), startTime = s.start.slice(11, 16);
    if (after && startDate === s.business_date && startTime < after) return false;
    return true;
  });

  const byMovie = new Map();
  for (const s of visible) {
    if (!byMovie.has(s.movie_key)) byMovie.set(s.movie_key, []);
    byMovie.get(s.movie_key).push(s);
  }
  const movies = [...byMovie.values()].sort((a, b) => b.length - a.length);

  const cards = movies.map((list) => {
    const title = list.map((s) => s.movie_title).sort((a, b) => a.length - b.length)[0];
    const first = list.find((s) => s.duration_mins) || list[0];
    const chainsHere = [...new Set(list.map((s) => s.chain))].join(" + ");
    const meta = [first.duration_mins && `${first.duration_mins} min`, first.rating && `Rated ${first.rating}`,
                  first.language, chainsHere].filter(Boolean).join(" · ");

    const byCinema = new Map();
    for (const s of list) {
      const key = `${s.chain}|${s.cinema_name}`;
      if (!byCinema.has(key)) byCinema.set(key, []);
      byCinema.get(key).push(s);
    }
    const rows = [...byCinema.entries()].sort().map(([key, cs]) => {
      const [chain, name] = key.split("|");
      const times = cs.sort((a, b) => a.start.localeCompare(b.start)).map((s) => {
        const chip = el(s.booking_url ? "a" : "span",
          { class: `time${s.sold_out ? " full" : ""}`, title: `${s.hall}${s.sold_out ? " — sold out" : ""}` },
          s.start.slice(11, 16), el("small", {}, s.experience));
        if (s.booking_url) { chip.href = s.booking_url; chip.target = "_blank"; chip.rel = "noopener"; }
        return chip;
      });
      return el("div", { class: "row" },
        el("div", { class: "cinema" }, el("span", { class: `badge ${chain}` }, chain), name),
        el("div", { class: "times" }, ...times));
    });
    return el("section", { class: "movie" }, el("h2", {}, title), el("div", { class: "meta" }, meta), ...rows);
  });

  const cinemaCount = new Set(visible.map((s) => `${s.chain}|${s.cinema_name}`)).size;
  const plural = (n, word) => `${n} ${word}${n === 1 ? "" : "s"}`;
  const summary = [plural(movies.length, "movie"), plural(visible.length, "showtime"), plural(cinemaCount, "cinema")].join(" · ");
  $("status").replaceChildren(summary, ...loadErrors.slice(0, 3).map((e) => el("div", { class: "err" }, `⚠ ${e}`)));
  $("results").replaceChildren(...cards);
}

$("controls").addEventListener("submit", (e) => { e.preventDefault(); load(); });
["movie", "cinema", "after"].forEach((id) => $(id).addEventListener("input", () => render()));
load();
</script>
</body>
</html>
